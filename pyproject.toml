[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "protodissect"
version = "0.1.0"
description = "Turn packet captures into Wireshark dissectors: deterministic protocol reverse engineering with optional local LLM field naming"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "protodissect contributors" }]
keywords = [
    "wireshark", "dissector", "protocol-reverse-engineering", "pcap", "pcapng",
    "network-security", "packet-analysis", "lua", "iot-security", "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: BSD License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
]

[project.scripts]
protodissect = "proto_dissect.cli:main"

[project.urls]
Homepage = "https://github.com/dilates/protodissect"
Documentation = "https://github.com/dilates/protodissect/tree/main/docs"
Issues = "https://github.com/dilates/protodissect/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/proto_dissect"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/proto_dissect"]
show_error_codes = true

[[tool.mypy.overrides]]
module = ["pyghidra.*", "ghidra.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "eval: LLM naming eval (nightly, needs a local model)",
]
filterwarnings = ["error::DeprecationWarning:proto_dissect.*"]

[tool.coverage.run]
source = ["src/proto_dissect"]
omit = ["src/proto_dissect/demo/*"]